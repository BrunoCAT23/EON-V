name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python 3.10 tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUNTIME_MODE: simulation
      MEMORY_SANDBOX: "true"
      HARDWARE_MODE: mock
      MOTION_DRY_RUN: "true"
      MIC_MODE: stub
      SPEAKER_MODE: stub
      CAMERA_MODE: stub
      DETECTOR_MODE: stub
      STT_MODE: fallback
      TTS_MODE: fallback
      OPENAI_ENABLED: "false"
      OLLAMA_ENABLED: "false"
      STARTUP_SOUND_ENABLED: "false"
      SOUND_EFFECTS_ENABLED: "false"
      PYTHONUTF8: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q
